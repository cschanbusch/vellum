[package]
name = "vellum"
version = "0.5.0"
license = "GPL-3.0-only"
edition = "2021"
default-run = "vellum"

[lib]
name = "vellum_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "7.0.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
notify-debouncer-mini = "0.7.0"
rquickjs = { version = "0.14", features = ["loader"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_Security_Credentials"] }
winreg = "0.56.0"

[dev-dependencies]
ab_glyph = "0.2"
tempfile = "3.27.0"

# Image decoding and resizing are far too slow unoptimized; dependencies are built with
# optimizations even in debug builds (our own crate stays fast to compile).
[profile.dev.package."*"]
opt-level = 2
