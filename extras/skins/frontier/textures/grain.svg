<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Film grain: light and dark specks on transparent. Tiles seamlessly. -->
  <defs>
    <filter id="g" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="1" seed="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="1.6 0 0 0 -0.3  1.6 0 0 0 -0.3  1.6 0 0 0 -0.3  0 0 0 0 0.34"/>
    </filter>
  </defs>
  <rect width="256" height="256" filter="url(#g)"/>
</svg>
