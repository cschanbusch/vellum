[package]
name = "vellum-starter"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Starts the active installed version of Vellum Game Launcher"

# Built on its own (scripts/package-portable.ps1), not as part of the app.
[workspace]

[[bin]]
name = "vellum-starter"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Registry", "Win32_UI_Shell"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
